services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  bench:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bench:bench@postgres:5432/bench
      # Actor and investigator endpoints are supplied per run, never baked in.
      ACTOR_BASE_URL: ${ACTOR_BASE_URL:-}
      ACTOR_API_KEY: ${ACTOR_API_KEY:-}
      ACTOR_MODEL: ${ACTOR_MODEL:-}
      INVESTIGATOR_MODEL: ${INVESTIGATOR_MODEL:-}
    volumes:
      - ../runs:/app/runs
    command: ["run", "--feed", "pilot_v1", "--agent", "scripted", "--actor", "scripted"]

volumes:
  pgdata:
